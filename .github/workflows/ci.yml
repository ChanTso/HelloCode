name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source
        run: npm run check

      - name: Build package
        run: npm run build

      - name: Smoke-test packed CLI
        shell: bash
        run: |
          pack_dir="$(mktemp -d)"
          install_dir="$(mktemp -d)"
          npm pack --pack-destination "$pack_dir"
          tarball="$(find "$pack_dir" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          npm install --global --prefix "$install_dir" "$tarball"
          "$install_dir/bin/hellocode" --version
          "$install_dir/bin/hellocode" --help > /dev/null
